<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Linkcraft — Offline</title>
    <style>
      body {
        background: #f5f7fb;
        color: #172033;
        font: 16px system-ui;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        padding: 30px;
        max-width: 430px;
      }
      h1 {
        font-size: 30px;
        letter-spacing: -1px;
      }
      p {
        color: #64748b;
        line-height: 1.8;
      }
      button {
        background: #2563eb;
        border: 0;
        border-radius: 8px;
        padding: 13px 20px;
        color: #ffffff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>A little pause.</h1>
      <p>
        You’re offline. Reconnect to open your workspace. Any links and prompts saved in your
        browser are still on this device.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
